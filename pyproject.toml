[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roubaix"
version = "0.2.0"
description = "Cognee-centered graph retrieval experiment with DSPy/GEPA and AdalFlow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.0",
  "uvicorn>=0.48.0",
  "pydantic>=2.13.0",
  "pydantic-settings>=2.14.0",
  "httpx>=0.28.0",
  "structlog>=25.5.0",
  "tenacity>=9.1.0",
  "orjson>=3.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.0",
  "mypy>=2.1.0",
]
temporal = [
  "temporalio>=1.27.0",
  "nexus-rpc>=1.4.0",
]
opt = [
  "dspy>=3.2.0",
  "adalflow>=1.1.0",
  "cognee>=1.1.0",
  "datasketch>=1.10.0",
]
demo = [
  "playwright>=1.60.0",
  "edge-tts>=7.2.0",
]
eval = [
  "langfuse>=2.0.0",
]
pggraph = [
  "asyncpg>=0.30.0",
  "cognee-community-graph-adapter-pggraph @ git+https://github.com/topoteretes/cognee-community.git#subdirectory=packages/graph/pggraph",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["cognee", "cognee.*", "cognee_community_graph_adapter_pggraph"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
