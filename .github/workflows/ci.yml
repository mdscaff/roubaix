name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --extra temporal --frozen

      - name: Ruff
        run: uv run ruff check app tests

      - name: Mypy
        run: uv run mypy app tests

      - name: Pytest
        run: uv run pytest -q

      # Routing is a pure function of the query, so it can be measured in CI
      # with no Cognee instance and no LLM. The gate is on the held-out corpus:
      # accuracy on the corpus the rules were written against proves nothing.
      - name: Routing accuracy (held-out)
        run: >-
          uv run python scripts/eval_routing.py
          --min-heldout-accuracy 0.80
          --require-lift
